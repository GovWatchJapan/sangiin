<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>国会ウォッチ — Diet Watch Japan</title>
    <script>
      // GitHub Pages SPA fallback: rewrite /foo/bar to /?p=/foo/bar so
      // index.html can restore the original path before TanStack Router boots.
      (function () {
        var l = window.location;
        var path = l.pathname + l.search + l.hash;
        l.replace(l.origin + l.pathname.replace(/\/[^/]*$/, "/") + "?p=" + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body></body>
</html>
